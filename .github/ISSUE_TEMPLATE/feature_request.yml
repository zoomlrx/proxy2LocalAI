name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请从实际使用场景出发描述。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果已有大致想法，请描述它如何工作。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你是否尝试过其他配置、脚本或工具？
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: 安全影响
      options:
        - label: 这个建议不会扩大浏览器权限、Bridge 监听范围或本地命令执行能力。
        - label: 如果会影响安全边界，我已经在描述中说明风险。
